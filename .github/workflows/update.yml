name: به‌روزرسانی قیمت‌ها

on:
  schedule:
    - cron: "30 7 * * *"     # هر روز 07:30 به وقت UTC (11:00 ظهر تهران)
  workflow_dispatch:          # اجرای دستی از تب Actions
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/**"
      - "docs/logos/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # اگر در Settings > Variables مقدار LOCAL_MODE=true بگذارید، این مرحله اجرا نمی‌شود
      # (برای وقتی که قیمت‌ها را روی کامپیوتر خودتان می‌گیرید و push می‌کنید)
      - name: دریافت قیمت‌ها
        id: upd
        if: ${{ vars.LOCAL_MODE != 'true' }}
        continue-on-error: true
        run: python update_data.py

      # ذخیره در مخزن اختیاری است؛ خطای آن نباید جلوی انتشار صفحه را بگیرد
      - name: ذخیره تغییرات در مخزن
        continue-on-error: true
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "تغییری نبود"
          else
            git commit -m "قیمت‌های $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: خطا در دریافت قیمت‌ها
        if: ${{ steps.upd.outcome == 'failure' }}
        run: |
          echo "دریافت قیمت‌ها ناموفق بود؛ صفحه با آخرین قیمت‌های ذخیره‌شده منتشر شد."
          exit 1

  deploy:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
